filebeat.inputs:
  - type: unifiedlogs
    id: unifiedlogs-e2e-bounded
    enabled: true
    start: '${UNIFIEDLOGS_E2E_START}'
    end: '${UNIFIEDLOGS_E2E_END}'
    predicate:
      - 'subsystem == "co.elastic.filebeat.unifiedlogs.e2e.primary"'
      - 'subsystem == "co.elastic.filebeat.unifiedlogs.e2e.secondary"'
    info: true
    debug: true
    signpost: true
    fields_under_root: true
    fields:
      e2e_source: bounded
    tags: ["unifiedlogs-e2e", "bounded", "predicate-or"]

output.logstash:
  hosts: ["127.0.0.1:5044"]
  bulk_max_size: 16

logging.level: debug
logging.selectors: ["*"]
logging.to_stderr: true
