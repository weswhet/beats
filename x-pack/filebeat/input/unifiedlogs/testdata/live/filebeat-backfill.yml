filebeat.inputs:
  - type: unifiedlogs
    id: unifiedlogs-e2e-backfill
    enabled: true
    backfill: true
    predicate:
      - 'subsystem == "co.elastic.filebeat.unifiedlogs.e2e.primary"'
      - 'subsystem == "co.elastic.filebeat.unifiedlogs.e2e.secondary"'
    info: true
    debug: true
    signpost: true
    fields_under_root: true
    fields:
      e2e_source: backfill
    tags: ["unifiedlogs-e2e", "backfill", "predicate-or"]

output.logstash:
  hosts: ["127.0.0.1:5044"]
  bulk_max_size: 16

http.enabled: true
http.host: 127.0.0.1
http.port: 5067

logging.level: debug
logging.selectors: ["*"]
logging.to_stderr: true
